<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор существ | CyberFantasy RPG</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #121420;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --neon-purple: #7a00ff;
            --neon-pink: #ff007a;
            --neon-cyan: #00f2fe;
            --gold: #ffd700;
            --crystal: #ff00ff;
            --rarity-common: #8e9eab;
            --rarity-rare: #00d2ff;
            --rarity-epic: #9d50bb;
            --rarity-leg1: #f12711;
            --rarity-leg2: #f5af19;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(18, 20, 32, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .header-top {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .resources {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .res-gold { color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .res-crystal { color: var(--crystal); text-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            outline: none;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        main {
            flex-grow: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .tab-content {
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 0.4s ease forwards;
        }

        .hidden {
            display: none !important;
        }

        .generator-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .summon-btn {
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, box-shadow 0.3s, opacity 0.3s;
        }

        .summon-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .summon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .summon-title {
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }

        .summon-cost {
            font-weight: 700;
            font-size: 14px;
            color: white;
            opacity: 0.9;
        }

        .btn-normal {
            background: linear-gradient(135deg, #2980b9, #2c3e50);
            box-shadow: 0 0 20px rgba(41, 128, 185, 0.4);
        }

        .btn-elite {
            background: linear-gradient(135deg, #8e44ad, #c0392b);
            box-shadow: 0 0 20px rgba(142, 68, 173, 0.4);
        }

        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .btn-save {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            transition: var(--transition);
        }
        
        .btn-save:hover { background: #27ae60; transform: translateY(-2px); }
        .btn-save:active { transform: scale(0.95); }

        .creature-card {
            background: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        .rarity-Обычный { border-color: var(--rarity-common); }
        .rarity-Редкий { border-color: var(--rarity-rare); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .rarity-Эпический { border-color: var(--rarity-epic); box-shadow: 0 0 25px rgba(157, 80, 187, 0.4); }
        
        @keyframes legendaryPulse {
            0% { box-shadow: 0 0 15px var(--rarity-leg1); border-color: var(--rarity-leg1); }
            50% { box-shadow: 0 0 35px var(--rarity-leg2); border-color: var(--rarity-leg2); }
            100% { box-shadow: 0 0 15px var(--rarity-leg1); border-color: var(--rarity-leg1); }
        }
        .rarity-Легендарный {
            border-width: 3px;
            animation: legendaryPulse 2s infinite;
        }

        .card-level-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--gold);
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .card-header {
            padding: 30px 20px 20px;
            text-align: center;
        }

        .badge-rarity {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .bg-common { background: var(--rarity-common); color: #000; }
        .bg-rare { background: var(--rarity-rare); color: #000; }
        .bg-epic { background: var(--rarity-epic); color: #fff; }
        .bg-legendary { background: linear-gradient(90deg, var(--rarity-leg1), var(--rarity-leg2)); color: #fff; }

        .creature-name {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
        }

        .card-stats {
            padding: 0 25px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
transition: width 0.5s ease-out;
}
.income-badge {
            text-align: center;
            background: rgba(255,215,0,0.08);
            border-top: 1px solid rgba(255,215,0,0.1);
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 2px dashed rgba(255,255,255,0.05);
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--text-muted), rgba(255,255,255,0.1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            justify-items: center;
            width: 100%;
        }

        .collection-card-actions {
            display: flex;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }

        .action-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-upgrade { color: var(--gold); }
        .btn-upgrade:hover:not(:disabled) { background: rgba(255, 215, 0, 0.1); }
        .btn-upgrade:disabled { color: var(--text-muted); opacity: 0.4; cursor: not-allowed; }

        .btn-delete { color: #ff4d4d; border-left: 1px solid rgba(255,255,255,0.05); }
        .btn-delete:hover { background: rgba(255, 77, 77, 0.1); }

        .bestiary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .bestiary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }

        .bestiary-card.locked {
            filter: grayscale(100%);
            opacity: 0.3;
        }

        .bestiary-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: var(--neon-cyan);
        }

        .bestiary-title { font-weight: 800; font-size: 16px; }
        .bestiary-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .achievements-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .achievement-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            gap: 15px;
        }

        .ach-info { display: flex; flex-direction: column; gap: 4px; }
        .ach-title { font-weight: 700; font-size: 15px; }
        .ach-desc { font-size: 12px; color: var(--text-muted); }
        .ach-reward { font-size: 13px; font-weight: 700; color: var(--crystal); margin-top: 2px; }

        .btn-claim {
            background: var(--crystal);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
            transition: var(--transition);
        }
        .btn-claim:hover { filter: brightness(1.2); }
        .btn-claim:disabled { background: #2c2e3e; color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

        .footer-actions {
            margin-top: 50px;
            text-align: center;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-reset:hover { background: #ff4d4d; color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Creature RPG</h1>
            <div class="resources">
                <span class="res-gold"><i class="fa-solid fa-coins"></i> <span id="ui-gold">100</span></span>
                <span class="res-crystal"><i class="fa-solid fa-gem"></i> <span id="ui-crystal">0</span></span>
            </div>
        </div>
        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-generator')"><i class="fa-solid fa-flask"></i> Инкубатор</button>
            <button class="tab-btn" onclick="switchTab('tab-collection')" id="tab-btn-coll"><i class="fa-solid fa-boxes-stacked"></i> Коллекция (0)</button>
            <button class="tab-btn" onclick="switchTab('tab-bestiary')"><i class="fa-solid fa-book-atlas"></i> Бестиарий</button>
            <button class="tab-btn" onclick="switchTab('tab-achievements')" id="tab-btn-ach"><i class="fa-solid fa-trophy"></i> Ачивки</button>
        </nav>
    </header>

    <main>
        <div id="tab-generator" class="tab-content">
            <div class="generator-actions">
                <button class="summon-btn btn-normal" onclick="summonCreature('normal')" id="btn-summon-normal">
                    <span class="summon-title">Обычный свиток</span>
                    <span class="summon-cost"><i class="fa-solid fa-coins"></i> 10 Золота</span>
                </button>
                <button class="summon-btn btn-elite" onclick="summonCreature('elite')" id="btn-summon-elite">
                    <span class="summon-title">Элитный свиток</span>
                    <span class="summon-cost"><i class="fa-solid fa-gem"></i> 5 Кристаллов</span>
                </button>
            </div>

            <div class="stage-container">
                <div id="generator-stage">
                    <div class="empty-state">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <h3>Использовать свиток призыва</h3>
                        <p style="font-size: 13px; margin-top: 5px;">Призовите существо, чтобы раскрыть его скрытый потенциал и характеристики.</p>
                    </div>
                </div>
                <button class="btn-save hidden" id="btn-save-action" onclick="saveCurrentCreature()">Сохранить в коллекцию</button>
            </div>
        </div>

        <div id="tab-collection" class="tab-content hidden">
            <div class="collection-grid" id="collection-gallery"></div>
        </div>

        <div id="tab-bestiary" class="tab-content hidden">
            <div class="bestiary-grid" id="bestiary-wrapper"></div>
        </div>

        <div id="tab-achievements" class="tab-content hidden">
            <div class="achievements-list" id="achievements-wrapper"></div>
        </div>

        <div class="footer-actions">
            <button class="btn-reset" onclick="resetGameData()"><i class="fa-solid fa-trash-can"></i> Сбросить прогресс</button>
        </div>
    </main>

    <script>
        const prefixes = ["Космический", "Древний", "Кибернетический", "Теневой", "Пылающий", "Радиоактивный", "Кристаллический", "Астральный", "Забытый", "Неоновый", "Грозовой", "Ледяной", "Мутировавший", "Бездонный", "Священный"];
        const bases = ["Дракон", "Голем", "Слайм", "Феникс", "Грифон", "Кракен", "Василиск", "Элементаль", "Цербер", "Горгулья", "Минотавр", "Пегас", "Единорог", "Выверна", "Левиафан"];
        const suffixes = ["Бездны", "Хаоса", "Света", "Смерти", "Вечности", "Разрушения", "Порядка", "Пустоты", "Иллюзий", "Стали", "Крови", "Времени", "Возмездия", "Тайны", "Бури"];

        const baseDescriptions = {
            "Дракон": "Легендарный крылатый ящер, повелевающий разрушительной стихией.",
            "Голем": "Огромный страж, высеченный из монолитного камня и оживленный рунами.",
            "Слайм": "Желейный сгусток магической энергии. На удивление живуч.",
            "Феникс": "Бессмертная птица, перерождающаяся из собственного пепла.",
            "Грифон": "Свирепый гибрид льва и орла, царь заоблачных вершин.",
            "Кракен": "Кошмар мореплавателей, способный утащить на дно целые флотилии.",
            "Василиск": "Смертоносный змей, чей взгляд заставляет кровь застывать в жилах.",
            "Элементаль": "Чистейшее воплощение природной магии, не знающее усталости.",
            "Цербер": "Трехглавый страж подземного мира, объятый адским пламенем.",
            "Горгулья": "Каменная статуя, оживающая под покровом ночной темноты.",
            "Минотавр": "Яростный быкоглавый страж запутанных подземных лабиринтов.",
            "Пегас": "Крылатый скакун, несущийся по небу быстрее самого ветра.",
            "Единорог": "Священное существо, чья чистота способна исцелить любой яд.",
            "Выверна": "Быстрая и ядовитая родственница драконов, атакующая с пике.",
            "Левиафан": "Исполинский змей, дремлющий на самом дне океанских впадин."
        };

        const baseIcons = {
            "Дракон": "fa-dragon", "Голем": "fa-mountain", "Слайм": "fa-bacterium", "Феникс": "fa-dove", "Грифон": "fa-feather-alt",
            "Кракен": "fa-shrimp", "Василиск": "fa-otter", "Элементаль": "fa-bolt-lightning", "Цербер": "fa-dog", "Горгулья": "fa-ghost",
            "Минотавр": "fa-skull", "Пегас": "fa-horse-head", "Единорог": "fa-horse", "Выверна": "fa-locust", "Левиафан": "fa-fish"
        };

        const statPool = [
            { name: "Атака", icon: "fa-sword", color: "#ff4d4d" },
            { name: "Защита", icon: "fa-shield-halved", color: "#4d94ff" },
            { name: "Магия", icon: "fa-wand-sparkles", color: "#b366ff" },
            { name: "Скорость", icon: "fa-bolt", color: "#ffd480" },
            { name: "Удача", icon: "fa-dice", color: "#4dff88" },
            { name: "Скрытность", icon: "fa-eye-slash", color: "#a6a6a6" },
            { name: "Интеллект", icon: "fa-brain", color: "#ff99dd" },
            { name: "Харизма", icon: "fa-heart", color: "#ff6666" },
            { name: "Радиация", icon: "fa-radiation", color: "#ccff33" },
            { name: "Прочность", icon: "fa-hammer", color: "#b37d4d" },
            { name: "Ярость", icon: "fa-fire", color: "#ff6600" },
            { name: "Мудрость", icon: "fa-book", color: "#00cc99" },
            { name: "Регенерация", icon: "fa-heart-pulse", color: "#ff3399" },
            { name: "Воля", icon: "fa-crown", color: "#e6b800" },
            { name: "Токсичность", icon: "fa-biohazard", color: "#33cc33" }
        ];

        const achievementsData = [
            { id: "first_click", title: "Первый ритуал", desc: "Призовите ваше самое первое существо.", target: 1, reward: 5 },
            { id: "collector_10", title: "Юный натуралист", desc: "Сохраните 10 существ в коллекцию.", target: 10, reward: 10 },
            { id: "gold_1000", title: "Золотая жила", desc: "Накопите на балансе 1,000 золота.", target: 1000, reward: 15 },
            { id: "lucky_drop", title: "Избранник судьбы", desc: "Выбейте существо Легендарной редкости.", target: 1, reward: 25 },
            { id: "master_level", title: "Высшая форма", desc: "Прокачайте любое существо до 5 уровня.", target: 5, reward: 20 }
        ];

        let state = {
            gold: 100,
            crystals: 0,
            collection: [],
            discoveredBases: [],
            claimedAchievements: [],
            stats: { totalSummons: 0 }
        };

        let tempCreature = null;

        function loadGame() {
            const saved = localStorage.getItem("rpg_generator_state");
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    if (!state.discoveredBases) state.discoveredBases = [];
                    if (!state.claimedAchievements) state.claimedAchievements = [];
                    if (!state.stats) state.stats = { totalSummons: 0 };
                } catch(e) {
                    console.error("Ошибка загрузки сейва", e);
                }
            }
            updateUI();
            renderBestiary();
            renderAchievements();
        }

        function saveGame() {
            localStorage.setItem("rpg_generator_state", JSON.stringify(state));
        }

        function resetGameData() {
            if(confirm("Вы действительно хотите сбросить весь игровой прогресс?")) {
                localStorage.removeItem("rpg_generator_state");
                location.reload();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');

            if(tabId === 'tab-collection') renderCollection();
            if(tabId === 'tab-achievements') renderAchievements();
            if(tabId === 'tab-bestiary') renderBestiary();
        }

        function updateUI() {
            document.getElementById("ui-gold").innerText = Math.floor(state.gold);
            document.getElementById("ui-crystal").innerText = state.crystals;
            document.getElementById("tab-btn-coll").innerHTML = `<i class="fa-solid fa-boxes-stacked"></i> Коллекция (${state.collection.length})`;
            
            document.getElementById("btn-summon-normal").disabled = state.gold < 10;
            document.getElementById("btn-summon-elite").disabled = state.crystals < 5;

            checkAchievementConditions();
        }

        function summonCreature(type) {
            if (type === 'normal') {
                if (state.gold < 10) return;
                state.gold -= 10;
            } else if (type === 'elite') {
                if (state.crystals < 5) return;
                state.crystals -= 5;
            }

            state.stats.totalSummons++;

            let rarity = "Обычный";
            let rand = Math.random() * 100;
            let minStat = 10, maxStat = 50, income = 1;

            if (type === 'normal') {
                if (rand < 2) { rarity = "Легендарный"; minStat = 85; maxStat = 100; income = 25; }
                else if (rand < 10) { rarity = "Эпический"; minStat = 70; maxStat = 90; income = 8; }
                else if (rand < 30) { rarity = "Редкий"; minStat = 45; maxStat = 70; income = 3; }
            } else {
                if (rand < 50) { rarity = "Легендарный"; minStat = 85; maxStat = 100; income = 25; }
                else { rarity = "Эпический"; minStat = 70; maxStat = 90; income = 8; }
            }

            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const base = bases[Math.floor(Math.random() * bases.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            const fullName = `${prefix} ${base} ${suffix}`;

            let pickedStats = [];
            let shuffledPool = [...statPool].sort(() => 0.5 - Math.random());
            for(let i = 0; i < 5; i++) {
                pickedStats.push({
                    name: shuffledPool[i].name,
                    icon: shuffledPool[i].icon,
                    color: shuffledPool[i].color,
                    value: Math.floor(Math.random() * (maxStat - minStat + 1)) + minStat
                });
            }

            if(!state.discoveredBases.includes(base)) {
                state.discoveredBases.push(base);
                renderBestiary();
            }

            tempCreature = {
                id: Date.now() + Math.random().toString(36).substr(2, 5),
                name: fullName,
                base: base,
                rarity: rarity,
                income: income,
                level: 1,
                stats: pickedStats
            };

            const stage = document.getElementById("generator-stage");
            stage.innerHTML = buildCardHTML(tempCreature);
            
            setTimeout(() => {
                stage.querySelectorAll('.progress-fill').forEach(el => {
                    el.style.width = el.getAttribute('data-value') + '%';
                });
            }, 50);

            document.getElementById("btn-save-action").classList.remove("hidden");
            updateUI();
            saveGame();
        }

        function buildCardHTML(creature, isCollection = false) {
            let rarityClass = `rarity-${creature.rarity}`;
            let badgeClass = "bg-common";
            if(creature.rarity === "Редкий") badgeClass = "bg-rare";
            if(creature.rarity === "Эпический") badgeClass = "bg-epic";
            if(creature.rarity === "Легендарный") badgeClass = "bg-legendary";

            let statsHTML = creature.stats.map(s => `
                <div class="stat-row">
                    <div class="stat-info">
                        <span class="stat-label"><i class="fa-solid ${s.icon}" style="color:${s.color}"></i> ${s.name}</span>
                        <span class="stat-value">${s.value}/100</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-value="${s.value}" style="background:${s.color}; ${isCollection ? 'width:'+s.value+'%' : ''}"></div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="creature-card ${rarityClass}">
                    <div class="card-level-badge">${creature.level}</div>
                    <div class="card-header">
                        <span class="badge-rarity ${badgeClass}">${creature.rarity}</span>
                        <div class="creature-name">${creature.name}</div>
                    </div>
                    <div class="card-stats">
                        ${statsHTML}
                    </div>
                    <div class="income-badge">
                        <i class="fa-solid fa-clock-rotate-left"></i> Доход: +${creature.income} золота/сек
                    </div>
                    ${isCollection ? `
                        <div class="collection-card-actions">
                            <button class="action-btn btn-upgrade" onclick="upgradeCreature('${creature.id}')" id="up-btn-${creature.id}">
                                <i class="fa-solid fa-arrow-up-from-ground-water"></i> Ап (${Math.floor(50 * Math.pow(1.5, creature.level))})
                            </button>
                            <button class="action-btn btn-delete" onclick="deleteCreature('${creature.id}')">
                                <i class="fa-solid fa-door-open"></i> Воля
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function saveCurrentCreature() {
            if(!tempCreature) return;
            state.collection.unshift(tempCreature);
            tempCreature = null;
            
            document.getElementById("generator-stage").innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-check" style="background:none; -webkit-text-fill-color:#2ecc71;"></i>
                    <h3>Существо успешно сохранено!</h3>
                    <p style="font-size: 13px; margin-top: 5px;">Оно перемещено во вкладку вашей коллекции и начало приносить доход.</p>
                </div>
            `;
            document.getElementById("btn-save-action").classList.add("hidden");
            updateUI();
            saveGame();
        }

        function renderCollection() {
            const gallery = document.getElementById("collection-gallery");
            if(state.collection.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1; margin: 20px auto;">
                        <i class="fa-solid fa-box-open"></i>
                        <h3>Коллекция пуста</h3>
                        <p>Ваши существа появятся здесь сразу после призыва и сохранения.</p>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = state.collection.map(c => buildCardHTML(c, true)).join('');
            
            state.collection.forEach(c => {
                let cost = Math.floor(50 * Math.pow(1.5, c.level));
                let btn = document.getElementById(`up-btn-${c.id}`);
                if(btn && state.gold < cost) btn.disabled = true;
            });
        }

        function upgradeCreature(id) {
            let creature = state.collection.find(c => c.id === id);
            if(!creature) return;

            let cost = Math.floor(50 * Math.pow(1.5, creature.level));
            if(state.gold < cost) return;

            state.gold -= cost;
            creature.level += 1;
            
            creature.stats.forEach(s => {
                s.value = Math.min(100, s.value + 2);
            });

            updateUI();
            renderCollection();
            saveGame();
        }

        function deleteCreature(id) {
            if(confirm("Отпустить это существо на волю? Вы потеряете его навсегда!")) {
                state.collection = state.collection.filter(c => c.id !== id);
                updateUI();
                renderCollection();
                saveGame();
            }
        }

        setInterval(() => {
            if(state.collection.length > 0) {
                let totalIncome = state.collection.reduce((sum, c) => sum + c.income, 0);
                state.gold += totalIncome;
                
                document.getElementById("ui-gold").innerText = Math.floor(state.gold);
                
                if(state.gold >= 10) {
                    const btnNormal = document.getElementById("btn-summon-normal");
                    if(btnNormal) btnNormal.disabled = false;
                }

                if(!document.getElementById("tab-collection").classList.contains("hidden")) {
                    state.collection.forEach(c => {
                        let cost = Math.floor(50 * Math.pow(1.5, c.level));
                        let btn = document.getElementById(`up-btn-${c.id}`);
                        if(btn) btn.disabled = state.gold < cost;
                    });
                }
            }
        }, 1000);

        function renderBestiary() {
            const wrapper = document.getElementById("bestiary-wrapper");
            wrapper.innerHTML = bases.map(b => {
                let isDiscovered = state.discoveredBases.includes(b);
                let iconClass = baseIcons[b] || "fa-dragon";
                if(isDiscovered) {
                    return `
                        <div class="bestiary-card">
                            <div class="bestiary-icon"><i class="fa-solid ${iconClass}"></i></div>
                            <div class="bestiary-title">${b}</div>
                            <div class="bestiary-desc">${baseDescriptions[b] || "Описание затерялось в архивах..."}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="bestiary-card locked">
                            <div class="bestiary-icon"><i class="fa-solid fa-circle-question"></i></div>
                            <div class="bestiary-title">???</div>
                            <div class="bestiary-desc">Призовите существо данного типа, чтобы изучить информацию о нем.</div>
                        </div>
                    `;
                }
            }).join('');
        }

        function renderAchievements() {
            const wrapper = document.getElementById("achievements-wrapper");
            wrapper.innerHTML = achievementsData.map(a => {
                let isCompleted = checkSingleAchievement(a.id);
                let isClaimed = state.claimedAchievements.includes(a.id);
                
                let btnAttr = "";
                let btnText = "Не выполнено";
                
                if(isClaimed) {
                    btnAttr = "disabled";
                    btnText = "Получено";
                } else if(isCompleted) {
                    btnText = "Забрать награду";
                } else {
                    btnAttr = "disabled";
                }

                return `
                    <div class="achievement-item">
                        <div class="ach-info">
                            <div class="ach-title">${a.title}</div>
                            <div class="ach-desc">${a.desc}</div>
                            <div class="ach-reward"><i class="fa-solid fa-gem"></i> Награда: +${a.reward} кр.</div>
                        </div>
                        <button class="btn-claim" ${btnAttr} onclick="claimAchievement('${a.id}', ${a.reward})">${btnText}</button>
                    </div>
                `;
            }).join('');
        }

        function checkSingleAchievement(id) {
            if(id === "first_click") return state.stats.totalSummons >= 1;
            if(id === "collector_10") return state.collection.length >= 10;
            if(id === "gold_1000") return state.gold >= 1000;
            if(id === "lucky_drop") return state.collection.some(c => c.rarity === "Легендарный") || (tempCreature && tempCreature.rarity === "Легендарный");
            if(id === "master_level") return state.collection.some(c => c.level >= 5);
            return false;
        }

        function checkAchievementConditions() {
            let readyCount = 0;
            achievementsData.forEach(a => {
                if(checkSingleAchievement(a.id) && !state.claimedAchievements.includes(a.id)) {
                    readyCount++;
                }
            });
            const tabBtn = document.getElementById("tab-btn-ach");
            if(tabBtn) {
                if(readyCount > 0) {
                    tabBtn.innerHTML = `<i class="fa-solid fa-trophy" style="color:var(--gold)"></i> Ачивки (${readyCount})`;
                } else {
                    tabBtn.innerHTML = `<i class="fa-solid fa-trophy"></i> Ачивки`;
                }
            }
        }

        function claimAchievement(id, reward) {
            if(state.claimedAchievements.includes(id)) return;
            state.claimedAchievements.push(id);
            state.crystals += reward;
            updateUI();
            renderAchievements();
            saveGame();
        }

        window.onload = loadGame;
    </script>
</body>
</html>
